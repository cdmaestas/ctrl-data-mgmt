name: Release

# Publishing is irreversible: PyPI never lets a filename be reused, even after
# you delete the release. So this workflow is built to make the wrong thing
# hard rather than to be convenient --
#
#   * the tag must match the version in pyproject.toml
#   * the tests must pass on the tagged commit, not "recently on main"
#   * TestPyPI goes first, and the real upload publishes the SAME artifacts
#   * the pypi job runs in a protected environment, so you can require an
#     approval click before anything leaves the building
#
# Authentication is Trusted Publishing (OIDC): no API token exists to leak or
# rotate. See docs/releasing.md for the one-time PyPI setup.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      testpypi_only:
        description: "Publish to TestPyPI only (dry run)"
        type: boolean
        default: true

permissions: {}

jobs:
  verify:
    name: verify tag, tests, and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]" build twine

      # A tag that disagrees with the packaged version produces a release whose
      # filename and git history say different things, and it cannot be undone.
      - name: Tag matches the version in pyproject.toml
        id: version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, pathlib, re
          text = pathlib.Path("pyproject.toml").read_text()
          version = re.search(r'^version\s*=\s*"([^"]+)"', text, re.M).group(1)
          ref = os.environ.get("GITHUB_REF", "")
          if ref.startswith("refs/tags/"):
              tag = ref.split("/", 2)[2]
              if tag != f"v{version}":
                  raise SystemExit(
                      f"tag {tag} does not match pyproject version {version}; "
                      f"expected tag v{version}")
          print(f"version={version}")
          PY

      - name: Tests
        run: pytest -q --cov=cdm --cov-fail-under=80

      - name: Lint
        run: ruff check .

      - name: Build
        run: python -m build

      - name: Check metadata
        run: twine check --strict dist/*

      - name: Contents are complete
        run: |
          python - <<'PY'
          import glob, tarfile, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          assert any(n.endswith("share/man/man1/cdm.1") for n in names), "man page"
          assert any(n.endswith("licenses/LICENSE") for n in names), "licence"
          sdist = tarfile.open(glob.glob("dist/*.tar.gz")[0]).getnames()
          for wanted in ("man/cdm.1", "docs/multi-host.md", "CONTRIBUTING.md", "LICENSE"):
              assert any(n.endswith(wanted) for n in sdist), wanted
          print("artifacts complete")
          PY

      # Everything downstream publishes THESE files. Rebuilding per job would
      # mean the thing you tested is not the thing you shipped.
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    name: publish to TestPyPI
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/ctrl-data-mgmt
    permissions:
      id-token: write   # Trusted Publishing; no token secret involved
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          # TestPyPI accumulates junk from other people's dry runs; a version
          # already sitting there should not fail a real release.
          skip-existing: true

  smoke:
    name: install from TestPyPI and run it
    needs: [verify, testpypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Proves the published artifact installs and runs as a stranger would get
      # it -- not as a checkout with the source sitting next to it.
      - name: Install the published wheel and exercise it
        run: |
          for attempt in 1 2 3 4 5; do
            if pip install --index-url https://test.pypi.org/simple/ \
                 --no-deps "ctrl-data-mgmt==${{ needs.verify.outputs.version }}"; then
              break
            fi
            echo "TestPyPI index not ready yet, retrying in 15s..."
            sleep 15
          done
          cdm --version
          mkdir -p /tmp/smoke/sub && echo hello > /tmp/smoke/sub/file.txt
          export CDM_DATA_DIR=/tmp/cdm-smoke
          cdm scan /tmp/smoke --checksum
          cdm find --name '*.txt' --quiet | grep -q file.txt
          cdm du /tmp/smoke | grep -q sub
          cdm doctor
          mode=$(stat -c '%a' "$CDM_DATA_DIR/index.db")
          [ "$mode" = "600" ] || { echo "index mode $mode, expected 600" >&2; exit 1; }
          echo "smoke test passed"

  pypi:
    name: publish to PyPI
    needs: [verify, testpypi, smoke]
    # Never on a manual dry run, and never on anything but a tag.
    if: startsWith(github.ref, 'refs/tags/v') && inputs.testpypi_only != true
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ctrl-data-mgmt
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github_release:
    name: create the GitHub release
    needs: [verify, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
