name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          # The README claims macOS; prove it. Filesystem semantics -- case
          # folding, ctime, symlinks -- are exactly where a crawler diverges.
          - os: macos-latest
            python-version: "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install with dev extras
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # A man page with a roff error renders as garbage rather than failing, so
      # nothing would notice without this.
      - name: Lint the man page
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mandoc
          mandoc -Tlint man/cdm.1

      # A hook that loses its executable bit or its shebang still sits in the
      # tree looking like protection while silently doing nothing.
      - name: Hooks are executable and not no-ops
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          for hook in .githooks/*; do
            [ -x "$hook" ] || { echo "$hook is not executable" >&2; exit 1; }
            head -1 "$hook" | grep -q '^#!' || { echo "$hook has no shebang" >&2; exit 1; }
            bash -n "$hook" || { echo "$hook has a syntax error" >&2; exit 1; }
            grep -q 'set -e' "$hook" || {
              echo "$hook does not set -e; a failing check would not stop the commit" >&2
              exit 1; }
            echo "$hook ok"
          done

      # Every documented verb must exist, and every verb must be documented.
      # Docs drifting from behaviour is the failure this catches.
      - name: Man page and CLI agree on the verb list
        if: runner.os == 'Linux'
        run: |
          python - <<'PY'
          import re, pathlib
          from cdm.cli import build_parser

          sub = next(a for a in build_parser()._actions if hasattr(a, "choices") and a.choices)
          verbs = set(sub.choices)

          page = pathlib.Path("man/cdm.1").read_text()
          body = page.split(".SH COMMANDS", 1)[1].split(".SH SCAN OPTIONS", 1)[0]
          documented = set(re.findall(r'^\.BI? "?([a-z]+)', body, re.M))

          missing = verbs - documented
          extra = documented - verbs
          if missing or extra:
              raise SystemExit(
                  f"man page out of sync: undocumented={sorted(missing)} "
                  f"documented-but-absent={sorted(extra)}")
          print(f"verbs agree: {sorted(verbs)}")
          PY

      - name: Test with coverage
        run: pytest -q --cov=cdm --cov-report=term-missing --cov-fail-under=80

      - name: Import cleanly and run as a module
        run: |
          python -c "import cdm, cdm.cli, cdm.scan, cdm.query, cdm.db"
          python -m cdm --help > /dev/null

  package:
    name: package (build, metadata, wheel + sdist install)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: python -m pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      # PyPI rejects bad metadata at upload time and a version cannot be
      # reused, so catch it here rather than burning a release.
      - name: Check distribution metadata
        run: twine check --strict dist/*

      - name: Assert the wheel ships its licence and one console script
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          zf = zipfile.ZipFile(wheel)
          names = zf.namelist()
          assert any(n.endswith("licenses/LICENSE") for n in names), names
          entry = next(n for n in names if n.endswith("entry_points.txt"))
          text = zf.read(entry).decode()
          assert "cdm = cdm.cli:main" in text, text
          # The man page is installed data, not package data, so a packaging
          # change can drop it silently while everything still imports.
          assert any(n.endswith("share/man/man1/cdm.1") for n in names), names
          print("wheel contents OK")
          PY

      - name: Assert the sdist can rebuild and re-document the project
        run: |
          python - <<'PY'
          import glob, tarfile
          sdist = glob.glob("dist/*.tar.gz")[0]
          names = tarfile.open(sdist).getnames()
          for wanted in ("man/cdm.1", "docs/multi-host.md", "CONTRIBUTING.md",
                         "tests/test_scan.py", "LICENSE"):
              assert any(n.endswith(wanted) for n in names), f"{wanted} missing from sdist"
          print("sdist contents OK")
          PY

      - name: Install the built wheel into a fresh venv
        run: |
          python -m venv /tmp/wheel-test
          /tmp/wheel-test/bin/pip install dist/*.whl
          /tmp/wheel-test/bin/cdm --help > /dev/null
          /tmp/wheel-test/bin/python -m cdm --help > /dev/null

      # The sdist is what pip falls back to when no wheel matches, so it has to
      # build and run on its own rather than just ride along in the release.
      - name: Install the sdist into a fresh venv
        run: |
          python -m venv /tmp/sdist-test
          /tmp/sdist-test/bin/pip install dist/*.tar.gz
          /tmp/sdist-test/bin/cdm --help > /dev/null

      - name: "doctor exits 1 with no index, without crashing"
        run: |
          set +e
          out=$(CDM_DATA_DIR=/tmp/empty-index /tmp/wheel-test/bin/cdm doctor 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -ne 1 ]; then
            echo "expected doctor to exit 1 on a missing index; got $rc" >&2
            exit 1
          fi
          case "$out" in
            *Traceback*) echo "doctor raised an exception" >&2; exit 1 ;;
          esac

      - name: "the index is created 0600"
        run: |
          export CDM_DATA_DIR=/tmp/mode-check
          mkdir -p /tmp/scan-me && echo hello > /tmp/scan-me/file.txt
          /tmp/wheel-test/bin/cdm scan /tmp/scan-me > /dev/null 2>&1
          mode=$(stat -c '%a' "$CDM_DATA_DIR/index.db")
          echo "index mode: $mode"
          if [ "$mode" != "600" ]; then
            echo "index must be 0600, got $mode" >&2
            exit 1
          fi
