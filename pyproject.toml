[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ctrl-data-mgmt"
version = "0.1.0"
description = "A local file metadata catalog. Index what you own, find it again, spot the duplicates."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "cdmaestas" }]
keywords = ["catalog", "filesystem", "index", "dedupe", "metadata", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Filesystems",
  "Topic :: Utilities",
]
# Deliberately zero runtime dependencies: sqlite3, hashlib and os.scandir are
# all stdlib, so `pipx install ctrl-data-mgmt` cannot break an environment.
dependencies = []

[project.optional-dependencies]
# The MCP SDK needs Python 3.10+ and pulls in pydantic, starlette, uvicorn and
# more -- which is exactly why it is an extra. The core that goes onto other
# people's clusters stays stdlib-only on 3.9; the marker makes the extra a no-op
# there, and `cdm mcp` says why instead of failing on import.
mcp = ["mcp>=2.2,<3; python_version >= '3.10'"]
dev = [
  "pytest>=7", "pytest-cov>=4", "ruff>=0.5", "build>=1",
  "mcp>=2.2,<3; python_version >= '3.10'",
]

[project.urls]
Homepage = "https://github.com/cdmaestas/ctrl-data-mgmt"
Repository = "https://github.com/cdmaestas/ctrl-data-mgmt"
Issues = "https://github.com/cdmaestas/ctrl-data-mgmt/issues"

[project.scripts]
cdm = "cdm.cli:main"

[tool.setuptools.packages.find]
include = ["cdm*"]

# Installs to <prefix>/share/man/man1. Note that a pipx or venv install puts
# this inside the venv rather than on the system MANPATH, so `man cdm` only
# works after a system-wide install or with MANPATH pointed at the venv.
# `man ./man/cdm.1` always works from a checkout.
[tool.setuptools.data-files]
"share/man/man1" = ["man/cdm.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W"]
